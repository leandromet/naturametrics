# Cloud Build → Artifact Registry → Cloud Run, triggered from GitHub `main`.
#
# ── The logging option is NOT optional ──────────────────────────────────────
# When a build runs under a user-specified service account (which Cloud Build now
# requires — the legacy per-project Cloud Build SA is deprecated), it may no
# longer write logs to Google's own bucket. Omitting `options.logging` fails the
# trigger before the build even starts, with:
#
#   invalid argument: if 'build.service_account' is specified, the build must
#   either (a) specify 'build.logs_bucket', (b) use the
#   REGIONAL_USER_OWNED_BUCKET build.options.default_logs_bucket_behavior
#   option, or (c) use either CLOUD_LOGGING_ONLY / NONE logging options
#
# CLOUD_LOGGING_ONLY is the simplest of the three: logs go to Cloud Logging and
# no bucket is needed. Use `defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET`
# instead if you want them in a GCS bucket you own.

substitutions:
  _REGION: us-west1                      # matches yvynation-reflex and the trigger
  _SERVICE: naturametrics
  _IMAGE: gcr.io/ee-leandromet/naturametrics
  # Runtime identity. The default compute SA is already Earth-Engine-enabled
  # in this project — yvynation-reflex runs on it with no EE key at all.
  _RUNTIME_SA: 652582010777-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8      # the Reflex/bun frontend build is the slow part

# Registry. Uses the project's existing `gcr.io` Artifact Registry repo, which is
# already present — no new repository to create. To move to a dedicated regional
# repo instead:
#   gcloud artifacts repositories create naturametrics \
#     --repository-format=docker --location=us-west1 --project=ee-leandromet
# and set _IMAGE to us-west1-docker.pkg.dev/${PROJECT_ID}/naturametrics/naturametrics

timeout: 1800s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${SHORT_SHA}
      - --tag=${_IMAGE}:latest
      - .

  # The push MUST be its own step, before deploy.
  #
  # The top-level `images:` field also pushes, but only AFTER every step has
  # finished — so a deploy step that references the tag runs while it does not
  # yet exist, and Cloud Run fails the revision with "Image ... not found".
  # That is what broke build 8eb829ba. Pushing explicitly here fixes the
  # ordering; `images:` is deliberately not used.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --cpu=2
      - --memory=4Gi
      - --concurrency=40
      - --timeout=300
      - --min-instances=0
      - --max-instances=4
      - --cpu-boost
      # `--allow-unauthenticated` is NOT set here: it makes gcloud set an IAM
      # policy binding (allUsers → run.invoker), which the build service account
      # can only do with roles/run.admin. With roles/editor it fails the deploy.
      # Grant public access once, out of band:
      #   gcloud run services add-iam-policy-binding naturametrics \
      #     --region=us-west1 --member=allUsers --role=roles/run.invoker
      # It persists across revisions, so it is a one-off rather than per-deploy.
      #
      # No EE credentials: Cloud Run supplies ADC for the attached service
      # account via the metadata server (auth method 2 in ee_client.py), which
      # is how yvynation-reflex runs. PORT is injected by Cloud Run — never set.
      #
      # --set-env-vars REPLACES the whole env var list on every deploy — it is
      # not additive. NM_GA_MEASUREMENT_ID must live here, not be set later via
      # `gcloud run services update`, or the next push silently drops it again
      # (found 2026-08-24: that's exactly what happened the first time this was
      # wired up). Not a secret — GA4 Measurement IDs are public by design,
      # shipped in every page's HTML — so a literal here is fine, same as the
      # other config values on this line.
      #
      # NM_BASEMAP=google_hybrid (2026-09): previously pinned to esri_imagery
      # because the mt1.google.com tile endpoints this app's `google_*`
      # basemaps use are undocumented, not a licensed Maps Platform API in
      # their own right (config/datasets.py). This project now has the Google
      # Maps API activated on Cloud Run, which was the missing cover — a
      # manual edit to this value in the Cloud Run console will NOT stick,
      # since this line replaces it on every push; change it here instead.
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},NM_EE_TIER=partner,NM_EE_CONCURRENCY=64,NM_BASEMAP=google_hybrid,NM_SPOT_ENABLED=false,NM_GA_MEASUREMENT_ID=G-HKS5YTT9DP
